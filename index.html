<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Driver Receipt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 0;
}

.controls {
    text-align: center;
    margin: 20px;
}

input {
    padding: 6px;
    margin: 5px;
}

button {
    padding: 8px 16px;
    cursor: pointer;
}

.receipt-wrapper {
    width: 210mm;
    min-height: 297mm;
    display: flex;
    justify-content: center;
}

.receipt {
    width: 170mm;
    margin-top: 40mm;
}

.title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 35px;
    letter-spacing: 1px;
}

.line {
    font-size: 18px;
    margin-bottom: 18px;
    line-height: 28px;
}

.fill-line {
    display: inline-block;
    border-bottom: 1px solid black;
    min-width: 200px;
    padding: 0 6px;
    color: #0b3d91;
    font-weight: bold;
}

.fill-short {
    min-width: 120px;
}

.fill-long {
    min-width: 350px;
}

.bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 60px;
}

.left-bottom {
    font-size: 16px;
    line-height: 30px;
}

.right-bottom {
    text-align: center;
    width: 130px;
}

.stamp {
    width: 110px;
}

.signature-img {
    width: 100px;
    margin-top: -85px;
    position: relative;
    z-index: 2;
}

.signature-text {
    margin-top: 38px;
    font-size: 16px;
}

/* Align Signature text parallel with Date */
.signature-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

@media print {
    .controls {
        display: none;
    }
}
</style>
</head>

<body>

<div class="controls">
    <input type="text" id="driverName" value="Driver Name">
    <input type="number" id="amount" value="10000" oninput="convertToWords()">
    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="text" id="monthYear">
    <input type="text" id="place">
    <input type="date" id="date">
    <input type="file" id="signatureUpload" accept="image/*">
    <br><br>
    <button onclick="generate()">Generate</button>
    <button onclick="downloadPDF()">Download PDF</button>
</div>

<div id="receiptArea" class="receipt-wrapper">

<div class="receipt">

<div class="title">DRIVER RECEIPT</div>

<div class="line">
I <span class="fill-line fill-long" id="rDriverName"></span>
received sum of Rs
<span class="fill-line fill-short" id="rAmount"></span> /-
</div>

<div class="line">
(Rupees <span class="fill-line fill-long" id="rAmountWords"></span>)
from
</div>

<div class="line">
<span class="fill-line fill-long" id="rEmployeeName"></span>
as driver for the month of
<span class="fill-line fill-short" id="rMonthYear"></span>.
</div>

<div class="bottom-row">

    <div class="left-bottom">
        Place: <span class="fill-line fill-short" id="rPlace"></span><br>
        Date: <span class="fill-line fill-short" id="rDateDisplay"></span>
    </div>

    <div class="right-bottom">
        <img src="stamp.png" class="stamp">
        <img id="signaturePreview" class="signature-img">
    </div>

</div>

<!-- Signature text aligned parallel to Date -->
<div class="signature-row">
    <div></div>
    <div class="signature-text">SIGNATURE OF DRIVER</div>
</div>

</div>
</div>

<script>

/* Defaults */
window.onload = function() {

    const today = new Date();

    document.getElementById("date").valueAsDate = today;

    const options = { month: 'long', year: 'numeric' };
    document.getElementById("monthYear").value =
        today.toLocaleDateString('en-IN', options);

    document.getElementById("place").value = "Hyderabad";

    convertToWords();
    generate();
}

function generate() {

    rDriverName.textContent = driverName.value;
    rAmount.textContent = amount.value;
    rEmployeeName.textContent = employeeName.value;
    rMonthYear.textContent = monthYear.value;
    rPlace.textContent = place.value;

    const selectedDate = new Date(date.value);
    rDateDisplay.textContent =
        selectedDate.toLocaleDateString('en-IN');
}

document.getElementById("signatureUpload")
.addEventListener("change", function(event) {

    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("signaturePreview").src =
                e.target.result;
        }
        reader.readAsDataURL(file);
    }
});

/* Indian Words */
function convertToWords() {

    const num = parseInt(amount.value);
    if (!num) return;

    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five',
        'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven',
        'Twelve', 'Thirteen', 'Fourteen', 'Fifteen',
        'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];

    const b = ['', '', 'Twenty', 'Thirty', 'Forty',
        'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

    function words(n) {
        if (n < 20) return a[n];
        if (n < 100)
            return b[Math.floor(n/10)] + " " + a[n%10];
        if (n < 1000)
            return a[Math.floor(n/100)] + " Hundred " + words(n%100);
        if (n < 100000)
            return words(Math.floor(n/1000)) +
                " Thousand " + words(n%1000);
        if (n < 10000000)
            return words(Math.floor(n/100000)) +
                " Lakh " + words(n%100000);
        return words(Math.floor(n/10000000)) +
            " Crore " + words(n%10000000);
    }

    rAmountWords.textContent = words(num) + " Only";
}

function downloadPDF() {
    html2pdf().set({
        margin: 0,
        filename: "Driver_Receipt.pdf",
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(document.getElementById("receiptArea")).save();
}

</script>

</body>
</html>
