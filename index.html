<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Driver Receipt</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: "Times New Roman", serif;
    background: white;
}

.receipt {
    width: 800px;
    margin: auto;
    padding: 40px 60px;
}

.title {
    text-align: center;
    font-size: 34px;
    letter-spacing: 2px;
    margin-bottom: 40px;
}

.line {
    font-size: 20px;
    margin-bottom: 18px;
}

.fill {
    color: #0b3d91;
    font-weight: bold;
    border-bottom: 1px solid black;
    padding: 0 8px;
}

.row-bottom {
    display: flex;
    justify-content: space-between;
    margin-top: 60px;
}

.left-bottom {
    font-size: 18px;
}

.right-bottom {
    text-align: center;
    position: relative;
    width: 200px;
}

.stamp {
    width: 120px;
    position: absolute;
    top: -40px;
    left: 40px;
}

.signature-label {
    margin-top: 100px;
    font-size: 18px;
}

canvas {
    border: none;
    border-bottom: 1px solid black;
    margin-top: 80px;
}

.controls {
    text-align: center;
    margin-bottom: 30px;
}

input {
    margin: 5px;
    padding: 5px;
}

@media print {
    .controls {
        display: none;
    }
    body {
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="controls">
    <input type="text" id="driverName" placeholder="Driver Name">
    <input type="number" id="amount" placeholder="Amount">
    <input type="text" id="amountWords" placeholder="Amount in Words">
    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="text" id="monthYear" placeholder="Month-Year">
    <input type="text" id="place" placeholder="Place">
    <input type="date" id="date">
    <br><br>
    <button onclick="generate()">Generate</button>
    <button onclick="downloadPDF()">Download PDF</button>
</div>

<div id="receiptArea" class="receipt">

    <div class="title">DRIVER RECEIPT</div>

    <div class="line">
        I <span class="fill" id="rDriverName"></span>
        received sum of Rs
        <span class="fill" id="rAmount"></span> /-
    </div>

    <div class="line">
        (Rupees
        <span class="fill" id="rAmountWords"></span>)
        from
    </div>

    <div class="line">
        <span class="fill" id="rEmployeeName"></span>
        as driver for the month of
        <span class="fill" id="rMonthYear"></span>.
    </div>

    <div class="row-bottom">

        <div class="left-bottom">
            <div>Place: <span class="fill" id="rPlace"></span></div>
            <div style="margin-top:15px;">
                Date: <span class="fill" id="rDate"></span>
            </div>
        </div>

        <div class="right-bottom">

            <!-- Embedded Stamp -->
            <img class="stamp"
            src="stamp.png">

            <canvas id="signature" width="200" height="80"></canvas>
            <div class="signature-label">
                SIGNATURE OF DRIVER
            </div>

        </div>

    </div>

</div>

<script>

function generate() {
    rDriverName.textContent = driverName.value;
    rAmount.textContent = amount.value;
    rAmountWords.textContent = amountWords.value;
    rEmployeeName.textContent = employeeName.value;
    rMonthYear.textContent = monthYear.value;
    rPlace.textContent = place.value;
    rDate.textContent = date.value;
}

/* Signature */
const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");
let drawing = false;

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => {
    drawing = false;
    ctx.beginPath();
});
canvas.addEventListener("mousemove", draw);

function draw(e) {
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
}

/* PDF */
function downloadPDF() {
    const element = document.getElementById("receiptArea");
    html2pdf().set({
        margin: 0,
        filename: "Driver_Receipt.pdf",
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(element).save();
}

</script>

</body>
</html>
