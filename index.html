<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Driver Receipt</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: "Times New Roman", serif;
    background: white;
}

.controls {
    text-align: center;
    margin-bottom: 30px;
}

input {
    margin: 5px;
    padding: 6px;
}

button {
    padding: 8px 18px;
    cursor: pointer;
}

.receipt {
    width: 800px;
    margin: auto;
    padding: 60px 80px;
}

.title {
    text-align: center;
    font-size: 34px;
    letter-spacing: 2px;
    margin-bottom: 50px;
}

.line {
    font-size: 20px;
    margin-bottom: 18px;
}

.fill {
    color: #0b3d91;
    font-weight: bold;
    border-bottom: 1px solid black;
    padding: 0 8px;
}

.bottom-row {
    display: flex;
    justify-content: space-between;
    margin-top: 70px;
}

.left-bottom {
    font-size: 18px;
}

.right-bottom {
    position: relative;
    width: 200px;
    text-align: center;
}

.stamp {
    width: 130px;
}

.signature-img {
    position: absolute;
    top: 25px;
    left: 35px;
    width: 120px;
    opacity: 0.9;
}

.signature-label {
    margin-top: 10px;
    font-size: 18px;
}

@media print {
    .controls {
        display: none;
    }
}
</style>
</head>

<body>

<div class="controls">
    <input type="text" id="driverName" placeholder="Driver Name">
    <input type="number" id="amount" placeholder="Amount" oninput="convertToWords()">
    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="text" id="monthYear" placeholder="Month-Year (May-2025)">
    <input type="text" id="place" placeholder="Place">
    <input type="date" id="date">
    <input type="file" id="signatureUpload" accept="image/*">
    <br><br>
    <button onclick="generate()">Generate</button>
    <button onclick="downloadPDF()">Download PDF</button>
</div>

<div id="receiptArea" class="receipt">

    <div class="title">DRIVER RECEIPT</div>

    <div class="line">
        I <span class="fill" id="rDriverName"></span>
        received sum of Rs
        <span class="fill" id="rAmount"></span> /-
    </div>

    <div class="line">
        (Rupees
        <span class="fill" id="rAmountWords"></span>)
        from
    </div>

    <div class="line">
        <span class="fill" id="rEmployeeName"></span>
        as driver for the month of
        <span class="fill" id="rMonthYear"></span>.
    </div>

    <div class="bottom-row">

        <div class="left-bottom">
            <div>Place: <span class="fill" id="rPlace"></span></div>
            <div style="margin-top:15px;">
                Date: <span class="fill" id="rDate"></span>
            </div>
        </div>

        <div class="right-bottom">

            <img src="stamp.png" class="stamp">

            <!-- Signature on top of stamp -->
            <img id="signaturePreview" class="signature-img">

            <div class="signature-label">
                SIGNATURE OF DRIVER
            </div>

        </div>

    </div>

</div>

<script>

/* Generate Data */
function generate() {
    rDriverName.textContent = driverName.value;
    rAmount.textContent = amount.value;
    rEmployeeName.textContent = employeeName.value;
    rMonthYear.textContent = monthYear.value;
    rPlace.textContent = place.value;
    rDate.textContent = date.value;
}

/* Upload Signature */
document.getElementById("signatureUpload").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("signaturePreview").src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
});

/* Convert Number to Indian Words */
function convertToWords() {
    const num = parseInt(amount.value);
    if (!num) return;

    const a = [
        '', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven',
        'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen',
        'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen',
        'Nineteen'
    ];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty',
        'Sixty', 'Seventy', 'Eighty', 'Ninety'];

    function inWords(n) {
        if (n < 20) return a[n];
        if (n < 100) return b[Math.floor(n / 10)] + " " + a[n % 10];
        if (n < 1000) return a[Math.floor(n / 100)] + " Hundred " + inWords(n % 100);
        if (n < 100000) return inWords(Math.floor(n / 1000)) + " Thousand " + inWords(n % 1000);
        if (n < 10000000) return inWords(Math.floor(n / 100000)) + " Lakh " + inWords(n % 100000);
        return inWords(Math.floor(n / 10000000)) + " Crore " + inWords(n % 10000000);
    }

    rAmountWords.textContent = inWords(num) + " Only";
}

/* PDF Export */
function downloadPDF() {
    const element = document.getElementById("receiptArea");

    html2pdf().set({
        margin: 0,
        filename: "Driver_Receipt.pdf",
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(element).save();
}

</script>

</body>
</html>
