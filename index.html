<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Driver Receipt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    font-family:"Times New Roman", serif;
    margin:0;
}

.controls{
    text-align:center;
    margin:20px;
}

input{
    padding:6px;
    margin:5px;
}

button{
    padding:8px 16px;
    cursor:pointer;
}

.receipt-wrapper{
    width:210mm;
    min-height:267mm;
    display:flex;
    justify-content:center;
}

.receipt{
    width:170mm;
    margin-top:31mm;
}

.title{
    text-align:center;
    font-size:28px;
    margin-bottom:35px;
}

.line{
    font-size:18px;
    margin-bottom:20px;
}

.blank{
    display:inline-block;
    border-bottom:1px solid black;
    vertical-align:bottom;
    padding:0 5px;
    color:#0b3d91;
    font-weight:bold;
}

.blank-name{ width:85mm; }
.blank-amount{ width:30mm; text-align:center; }
.blank-words{ width:134mm; }
.blank-from{ width:90mm; }
.blank-month{ width:35mm; }

.bottom-row-final{
    display:flex;
    justify-content:space-between;
    margin-top:60px;
}

.place-date{
    width:50%;
    font-size:16px;
    line-height:28px;
    margin-top: 105px;
}

.sign-stamp-row{
    width:50%;
    text-align:right;
    position:relative;
}

.stamp-wrapper{
    position:relative;
    display:inline-block;
}

.stamp{
    width:110px;
}

.signature-img{
    position:absolute;
    top:30px;
    left:-15px;
    width:140px;
    opacity:0.95;
}

.signature-label{
    margin-top:10px;
    font-size:16px;
    white-space:nowrap;
}


.stamp{
    width:110px;
}

.signature-img{
    position:absolute;
    top:30px;        /* start inside stamp middle */
    left:-10px;      /* slightly outside left */
    width:140px;     /* extend outside stamp */
    opacity:0.95;
}

.signature-label{
    font-size:16px;
    white-space:nowrap;   /* force single line */
}

@media print{
    .controls{ display:none; }
}
</style>
</head>

<body>

<div class="controls">
    <input type="text" id="driverName" value="Driver Name">
    <input type="number" id="amount" value="10000" oninput="convertToWords()">
    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="text" id="monthYear">
    <input type="text" id="place">
    <input type="date" id="date">
    <input type="file" id="signatureUpload" accept="image/*">
    <br><br>
    <button onclick="generate()">Generate</button>
    <button onclick="downloadPDF()">Download PDF</button>
</div>

<div id="receiptArea" class="receipt-wrapper">
<div class="receipt">

<div class="title">DRIVER RECEIPT</div>

<div class="line">
I <span class="blank blank-name" id="rDriverName"></span>
received sum of Rs
<span class="blank blank-amount" id="rAmount"></span> /-
</div>

<div class="line">
(Rupees <span class="blank blank-words" id="rAmountWords"></span>)
from

</div>

<div class="line">
    <span class="blank blank-from" id="rEmployeeName"></span>
as driver for the month of
<span class="blank blank-month" id="rMonthYear"></span>.
</div>

<div class="bottom-row-final">

    <!-- LEFT 50% -->
    <div class="place-date">
        Place: <span class="blank blank-month" id="rPlace"></span><br>
        Date: <span class="blank blank-month" id="rDateDisplay"></span>
    </div>

    <!-- RIGHT 50% -->
    <div class="sign-stamp-row">
        <div class="stamp-wrapper">
            <img src="stamp.png" class="stamp">
            <img id="signaturePreview" class="signature-img">
        </div>
        <div class="signature-label">
            SIGNATURE OF DRIVER
        </div>
    </div>

</div>


</div>
</div>

<script>

/* Defaults */
window.onload=function(){
    const today=new Date();
    document.getElementById("date").valueAsDate=today;

    const options={ month:'long', year:'numeric' };
    document.getElementById("monthYear").value=
        today.toLocaleDateString('en-IN',options);

    document.getElementById("place").value="Hyderabad";

    convertToWords();
    generate();
}

function generate(){
    rDriverName.textContent=driverName.value;
    rAmount.textContent=amount.value;
    rEmployeeName.textContent=employeeName.value;
    rMonthYear.textContent=monthYear.value;
    rPlace.textContent=place.value;

    const d=new Date(date.value);
    rDateDisplay.textContent=d.toLocaleDateString('en-IN');
}

document.getElementById("signatureUpload")
.addEventListener("change",function(e){
    const file=e.target.files[0];
    if(file){
        const reader=new FileReader();
        reader.onload=function(ev){
            signaturePreview.src=ev.target.result;
        }
        reader.readAsDataURL(file);
    }
});

function convertToWords(){
    const num=parseInt(amount.value);
    if(!num) return;

    const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
    const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

    function words(n){
        if(n<20) return a[n];
        if(n<100) return b[Math.floor(n/10)]+" "+a[n%10];
        if(n<1000) return a[Math.floor(n/100)]+" Hundred "+words(n%100);
        if(n<100000) return words(Math.floor(n/1000))+" Thousand "+words(n%1000);
        if(n<10000000) return words(Math.floor(n/100000))+" Lakh "+words(n%100000);
        return words(Math.floor(n/10000000))+" Crore "+words(n%10000000);
    }

    rAmountWords.textContent=words(num)+" Only";
}

function downloadPDF(){
    html2pdf().set({
        margin:0,
        filename:"Driver_Receipt.pdf",
        html2canvas:{ scale:2 },
        jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' }
    }).from(document.getElementById("receiptArea")).save();
}

</script>

</body>
</html>
